version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: dataanalis_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: dataanalis_root_password
      MYSQL_DATABASE: dataanalis
      MYSQL_USER: dataanalis_user
      MYSQL_PASSWORD: dataanalis_password
    ports:
      - "3320:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pdataanalis_root_password"]
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - dataanalis_net

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: dataanalis_phpmyadmin
    restart: always
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: dataanalis_root_password
    ports:
      - "8094:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dataanalis_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dataanalis_backend
    restart: always
    ports:
      - "5010:5010"
    env_file:
      - ./backend/.env
    environment:
      - PORT=5010
      - DATABASE_URL=mysql://dataanalis_user:dataanalis_password@db:3306/dataanalis
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dataanalis_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://145.79.8.148:5010/api
    container_name: dataanalis_frontend
    restart: always
    ports:
      - "3010:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://145.79.8.148:5010/api
    depends_on:
      - backend
    networks:
      - dataanalis_net


volumes:
  mysql_data:

networks:
  dataanalis_net:
    driver: bridge
