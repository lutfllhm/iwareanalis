version: '3.8'

services:
  # MySQL Database
  dataanalis-db:
    image: mysql:8.0
    container_name: dataanalis-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword123}
      MYSQL_DATABASE: ${DB_NAME:-dataanalis}
      MYSQL_USER: ${DB_USER:-dataanalis_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-dataanalis_pass}
    ports:
      - "3319:3306"
    volumes:
      - dataanalis-mysql-data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/migration_add_transaksi_penjualan.sql:/docker-entrypoint-initdb.d/02-migration.sql
    networks:
      - dataanalis-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootpassword123}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  dataanalis-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dataanalis-api
    restart: unless-stopped
    ports:
      - "5010:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: mysql://${DB_USER:-dataanalis_user}:${DB_PASSWORD:-dataanalis_pass}@dataanalis-db:3306/${DB_NAME:-dataanalis}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ACCURATE_MOCK: ${ACCURATE_MOCK:-true}
    depends_on:
      dataanalis-db:
        condition: service_healthy
    networks:
      - dataanalis-network
    volumes:
      - ./backend/logs:/app/logs

  # Frontend Next.js
  dataanalis-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5010/api}
    container_name: dataanalis-web
    restart: unless-stopped
    ports:
      - "3010:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5010/api}
    depends_on:
      - dataanalis-backend
    networks:
      - dataanalis-network

volumes:
  dataanalis-mysql-data:
    driver: local

networks:
  dataanalis-network:
    driver: bridge
