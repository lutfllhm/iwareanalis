# ==========================================
# Nginx config SEMENTARA (sebelum sertifikat SSL ada)
# Gunakan file ini HANYA untuk proses issue certbot.
# Setelah certbot berhasil, ganti kembali ke nginx.conf (versi HTTPS penuh).
# ==========================================

server {
    listen 80;
    server_name analys.iwareid.com;

    # Lokasi untuk certbot webroot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Sementara proxy biasa dulu (opsional, boleh dihapus jika tidak perlu akses HTTP saat proses ini)
    location / {
        proxy_pass http://localhost:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
